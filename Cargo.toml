[package]
name = "kcs-klines"
version = "0.1.0"
edition = "2021"
description = "Historical KuCoin Spot OHLCV klines collector: resumable REST backfill into partitioned Parquet (Zstd)"
license = "MIT"
repository = "https://github.com/OWNER/kcs-klines"
readme = "README.md"
keywords = ["kucoin", "ohlcv", "klines", "parquet", "market-data"]
categories = ["command-line-utilities", "finance"]

[lib]
name = "kcs_klines"
path = "src/lib.rs"

[[bin]]
name = "kcs-klines"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arrow = "60"
parquet = { version = "60", features = ["arrow", "zstd"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "signal", "sync", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

clap = { version = "4", features = ["derive", "env", "wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"


[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "sync", "test-util"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
incremental = false
